  /api/accounts/admin/upgrade-requests/:
    get:
      operationId: accounts_admin_upgrade_requests_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: request_type
        schema:
          type: string
          enum:
          - PREMIUM
          - UPGRADE
        description: |-
          * `UPGRADE` - Level upgrade
          * `PREMIUM` - Premium subscription
      - in: query
        name: requested_level
        schema:
          type: integer
          enum:
          - 2
          - 3
          - 4
          - 5
        description: |-
          * `2` - Level 2
          * `3` - Level 3
          * `4` - Level 4
          * `5` - Level 5
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - APPROVED
          - PENDING
          - REJECTED
        description: |-
          * `PENDING` - Pending
          * `APPROVED` - Approved
          * `REJECTED` - Rejected
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
