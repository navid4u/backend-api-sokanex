      enum:
      - REGISTER
      - LOGIN
      - LOGOUT
      - PROFILE_UPDATE
      - ARTICLE_READ
      - VIDEO_WATCH
      - LIVE_JOIN
      - COURSE_VIEW
      - COURSE_SESSION_VIEW
      - CREATE
      - UPDATE
      - DELETE
      - SOCIAL
      - SECURITY
      type: string
      description: |-
        * `REGISTER` - Registration
        * `LOGIN` - Login
        * `LOGOUT` - Logout
        * `PROFILE_UPDATE` - Profile updated
