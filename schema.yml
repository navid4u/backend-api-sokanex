        * `COURSE_VIEW` - Course viewed
        * `COURSE_SESSION_VIEW` - Course session viewed
        * `CREATE` - Content created
        * `UPDATE` - Content updated
        * `DELETE` - Content deleted
        * `SOCIAL` - Social activity
        * `SECURITY` - Security activity
